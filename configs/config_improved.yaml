# configs/config_improved.yaml
# Configuration for the improved SleepDG-1 model

model_version: improved # 指定加载哪个版本的代码
eval_test_every_epoch: True
run_name: "sleepdg_improved_run"
results_root: "./results" # 结果保存的根目录
max_samples_per_dataset: # <--- 新增参数
  sleep-edfx: 3000     # 示例：sleep-edfx 最多加载 5000 个样本
  HMC: 3000            # 示例：HMC 最多加载 3000 个样本
  ISRUC: 3000                # 如果不指定，则加载全部
  SHHS1: 3000
  P2018: 3000
  # ABC:
# === 设备与种子 ===
seed: 443
gpus: "0,1,2" # 指定使用的GPU
# Virtual 模块参数
num_classes: 5


pretrained_original_base_dir: "/data/lijinyang/1_sleep/值得保存的实验结果/BASELINE/sleepdg_original_run_2025-10-25_21-59-43"
# === 数据集 ===
datasets_dir: '/data/lijinyang/1_sleep/datasets_dir'
target_domains: 'sleep-edfx'
num_workers: 0

# === 训练参数 ===
epochs: 200
batch_size: 128
lr: 0.001
clip_value: 1.0
label_smoothing: 0.1
loss_function: 'CrossEntropyLoss'

# === 模型参数 ===
model_type: 'LDP_CAA_Model' # 改进模型的标识
num_of_classes: 5
dropout: 0.1
# LDP 参数
projection_type: 'diag' # or 'lowrank'
lowrank_rank: 32
# CAA 参数
enable_stats_alignment: 1 # 1 表示 True
anchor_momentum: 0.9

num_domains: 4 # 源域数量z

# === 训练控制 ===
data_ratio: 1.0 # 使用全部训练数据
eval_ratio: 1.0 # 使用全部验证/测试数据


# --- SleepDG++ (主任务) 权重 ---
lambda_caa: 0.3      # [调低]
lambda_stat: 0.2     # [调低]
lambda_Areg: 0.1     # [调低]
lambda_ae: 1.0       # (保持)
lambda_coral: 0.0    # (保持 0)

# --- SleepDG-Virtual (新任务) 权重 ---
lambda_rec: 1.0      # [调低] (从 10.0 下降)
lambda_kl: 0.1       # (保持)
lambda_physio: 0.5   # (保持)
lambda_adv: 0.1      # (保持)
lambda_distill: 1.5  # [调高] (从 0.5 上升)
lr_D: 0.0001

# --- Virtual 增强控制 ---
virtual_aug_start_epoch: 0  # [调高] (给 C-VAE 预热时间)
virtual_aug_ratio: 0.5       # [调低] (降低增强频率)
virtual_aug_stages: [0, 2, 3, 4] # [修改] (跳过 N1)

virtual_params:
  style_dim: 64
  eeg_dim: 3000
  physio_feature_dim: 128